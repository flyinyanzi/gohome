<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>回来啦</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/rooms.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <main id="app">
    <section id="entrance" class="scene entrance is-active" aria-label="玄关">
      <div class="night"></div>
      <button id="door" class="door" aria-label="打开门">
        <span class="door-knob"></span>
      </button>
      <div class="entrance-copy">
        <p class="eyebrow">外面的事，先放在门外。</p>
        <h1>回家吧。</h1>
        <p class="hint">点一下门</p>
      </div>
    </section>

    <section id="home" class="scene home zoomable-scene" aria-label="家的总览">
      <div class="zoom-viewport">
        <div class="art-stage home-stage" data-zoom-stage>
          <img class="stage-bg" src="assets/images/home-concept.png" alt="" />

          <div class="home-copy">
            <h1>回来啦。</h1>
            <p>今晚想在哪里待一会儿？</p>
          </div>

          <button class="room-hotspot living" data-room="living-room" aria-label="进入客厅"><span class="sr-only">客厅</span></button>
          <button class="room-hotspot bedroom" data-room="bedroom" aria-label="进入卧室"><span class="sr-only">卧室</span></button>
          <button class="room-hotspot window" data-room="window-room" aria-label="进入窗边"><span class="sr-only">窗边</span></button>
          <button class="room-hotspot cat" data-room="cat-room" aria-label="进入猫猫房"><span class="sr-only">猫猫房</span></button>
          <button class="room-hotspot balcony" data-room="balcony" aria-label="进入阳台"><span class="sr-only">阳台</span></button>
          <button class="room-hotspot study" data-room="study" aria-label="进入书房"><span class="sr-only">书房</span></button>

          <div id="dodo-home" class="dodo" title="多多">●ᴥ●</div>
        </div>
      </div>

      <div class="zoom-controls" aria-label="画面缩放">
        <button type="button" data-zoom-out aria-label="缩小">−</button>
        <button type="button" data-zoom-reset aria-label="恢复">⌂</button>
        <button type="button" data-zoom-in aria-label="放大">＋</button>
      </div>
    </section>

    <section id="living-room" class="scene room room-living zoomable-scene">
      <div class="zoom-viewport">
        <div class="art-stage living-stage" data-zoom-stage>
          <img class="stage-bg" src="assets/images/living-room-v1.png" alt="夜晚温暖的客厅"
               onerror="this.style.display='none'; document.getElementById('living-hint').textContent='客厅背景图没有加载，请检查 assets/images/living-room-v1.png'; document.getElementById('living-hint').style.opacity='1';" />
          <div id="living-dim" class="living-dim"></div>

          <button class="back-home">← 回到家里</button>

          <button id="water-cup" class="living-hit hit-water" aria-label="喝水"></button>
          <button id="floor-lamp" class="living-hit hit-lamp" aria-label="调节落地灯亮度"></button>
          <button id="slow-down" class="living-hit hit-breathe" aria-label="慢一点"></button>

          <div id="record-game" class="record-game" aria-label="唱片小游戏">
            <div class="record-sleeve" aria-hidden="true">
              <div id="record-disc" class="record-disc" draggable="true" title="把唱片放到转盘中央"></div>
            </div>
            <div id="record-target" class="record-target" title="唱片机转盘中央">
              <span class="spindle"></span>
            </div>
          </div>

          <div id="breathing-orb" class="breathing-orb hidden">
            <span>跟着它，慢一点。</span>
          </div>

          <div id="living-hint" class="living-hint">点一点房间里的东西看看。</div>
          <div id="toast" class="toast" aria-live="polite"></div>
        </div>
      </div>

      <div class="zoom-controls" aria-label="画面缩放">
        <button type="button" data-zoom-out aria-label="缩小">−</button>
        <button type="button" data-zoom-reset aria-label="恢复">⌂</button>
        <button type="button" data-zoom-in aria-label="放大">＋</button>
      </div>
    </section>

    <section id="bedroom" class="scene room room-bedroom zoomable-scene">
      <div class="zoom-viewport">
        <div class="art-stage bedroom-stage" data-zoom-stage>
          <img class="stage-bg" src="assets/images/bedroom-v1.png" alt="温暖安静的卧室" />
          <div id="bedroom-dim" class="bedroom-dim"></div>

          <button class="back-home bedroom-back">← 回到家里</button>

          <!-- physical-object hotspots -->
          <button id="bedside-lamp" class="bed-hit lamp-hit" aria-label="调节床头灯">
            <span class="hot-dot"></span>
          </button>

          <button id="sleep-help" class="bed-hit sleep-hit" aria-label="睡不着的时候">
            <span class="hot-dot moon-dot">☾</span>
          </button>

          <!-- aligned exactly over the two painted UI buttons in bedroom-v1.png -->
          <button class="bed-hit dream-hit" data-panel="dream-panel" aria-label="打开梦境抽屉"></button>
          <button id="bed-note" class="bed-hit note-hit" aria-label="打开小纸条"></button>

          <!-- the painted window button becomes functional too -->
          <button id="bed-window" class="bed-hit bed-window-hit" aria-label="看看窗外"></button>
          <button id="pet-dodo" class="bed-hit dodo-hit" aria-label="摸摸多多"></button>
          <button id="bed-night-mode" class="bed-hit bed-night-hit" aria-label="夜间模式"></button>
          <div id="bed-window-stars" class="bed-window-stars hidden" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
          <div id="dodo-reaction" class="dodo-reaction hidden" aria-hidden="true">
            <span>♡</span><span>♡</span><span>♡</span>
          </div>


          <div id="sleep-card" class="sleep-card hidden">
            <button id="close-sleep-card" aria-label="关闭">×</button>
            <div class="sleep-moon">☾</div>
            <p>今晚不用急着睡着。</p>
            <small>先闭一会儿眼睛，躺着休息也算休息。</small>
            <div class="sleep-actions">
              <button id="start-bed-breathe" class="soft-action">跟着光慢一点</button>
              <button id="dim-bed-light" class="soft-action">把灯调暗</button>
              <button id="just-rest" class="soft-action">就这样躺一会儿</button>
            </div>
          </div>

          <div id="bed-breathe-orb" class="bed-breathe-orb hidden">
            <span>慢一点</span>
          </div>

          <div id="window-card" class="window-card hidden">
            <button id="close-window-card" aria-label="关闭">×</button>
            <p>外面还亮着一些灯。</p>
            <small>今晚先不用把所有事情想明白。</small>
          </div>

          <div id="bedroom-toast" class="bedroom-toast" aria-live="polite"></div>
        </div>
      </div>

      <div class="zoom-controls" aria-label="画面缩放">
        <button type="button" data-zoom-out aria-label="缩小">−</button>
        <button type="button" data-zoom-reset aria-label="恢复">⌂</button>
        <button type="button" data-zoom-in aria-label="放大">＋</button>
      </div>
    </section>

    <section id="window-room" class="scene room room-window">
      <button class="back-home">← 回到家里</button>
      <div class="room-card"><h2>窗边</h2><p>想说的话，可以先留在这里。</p></div>
      <button class="object note" data-panel="note-panel">写小纸条</button>
      <div class="rain"></div>
    </section>

    <section id="cat-room" class="scene room room-cat">
      <button class="back-home">← 回到家里</button>
      <div class="room-card"><h2>猫猫房</h2><p>这里没有任务，只有猫。</p></div>
      <div class="cat-grid">
        <button>纸箱里：多多</button>
        <button>窗台上：多多</button>
        <button>重要文件：还是多多</button>
      </div>
      <div class="dodo room-dodo">●ᴥ●</div>
    </section>

    <section id="balcony" class="scene room room-balcony">
      <button class="back-home">← 回到家里</button>
      <div class="room-card"><h2>阳台</h2><p>看看星星，许个愿吧。</p></div>
      <button id="shooting-star" class="shooting-star" aria-label="抓住流星">✦</button>
      <button class="object wish" data-panel="wish-panel">许愿</button>
    </section>

    <section id="study" class="scene room room-study">
      <button class="back-home">← 回到家里</button>
      <div class="room-card"><h2>书房</h2><p>以前做过的一些奇怪东西。</p></div>
      <div class="computer">
        <a href="games/gomoku/index.html">♟ 技能五子棋</a>
        <a href="games/mind-reader/index.html">🔮 读心术</a>
      </div>
    </section>
  </main>

  <dialog id="note-panel" class="panel">
    <form method="dialog">
      <button class="close">×</button>
      <h3>小纸条</h3>
      <textarea id="note-input" placeholder="今天想留下一句什么？"></textarea>
      <div class="actions">
        <button type="button" id="save-note">留在这里</button>
        <button type="button" id="release-note">让它随风走掉</button>
      </div>
      <div id="note-list" class="archive"></div>
    </form>
  </dialog>

  <dialog id="bed-note-panel" class="panel">
    <form method="dialog">
      <button class="close">×</button>
      <h3>床边小纸条</h3>
      <p class="panel-lead">想留下的话，就放在这里。</p>
      <textarea id="bed-note-input" placeholder="今天想记住什么？"></textarea>
      <div class="actions">
        <button type="button" id="save-bed-note">留在这里</button>
        <button type="button" id="release-bed-note">今晚先不留</button>
      </div>
      <div id="bed-note-list" class="archive"></div>
    </form>
  </dialog>

  <dialog id="wish-panel" class="panel">
    <form method="dialog">
      <button class="close">×</button>
      <h3>抓住了一颗流星</h3>
      <textarea id="wish-input" placeholder="要不要偷偷许一个愿？"></textarea>
      <div class="actions">
        <button type="button" id="save-wish">留下来</button>
        <button type="button" id="release-wish">送给星星</button>
      </div>
      <div id="wish-list" class="archive"></div>
    </form>
  </dialog>

  <dialog id="dream-panel" class="panel">
    <form method="dialog">
      <button class="close">×</button>
      <h3>梦境抽屉</h3>
      <label>昨晚梦见什么了？</label>
      <textarea id="dream-original"></textarea>
      <label>如果可以重写一次，你想让它怎么结束？</label>
      <textarea id="dream-rewrite"></textarea>
      <div class="actions">
        <button type="button" id="save-dream">把它放进抽屉</button>
      </div>
      <div id="dream-list" class="archive"></div>
    </form>
  </dialog>

  <script src="js/storage.js"></script>
  <script src="js/rooms.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/zoom.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
